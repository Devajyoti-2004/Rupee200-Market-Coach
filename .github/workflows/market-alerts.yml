name: Scheduled Market Notes

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These are approximate IST report times:
    # 08:45, 09:30, 10:00, 11:30, 13:30 and 14:45 on weekdays.
    - cron: "15 3 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "15 9 * * 1-5"

jobs:
  market-note:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate scheduled market note
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUDGET: "200"
          WATCHLIST: "NHPC,IRFC,IOC,ONGC,PNB,BANKBARODA,TATAPOWER,SUZLON,IDEA,YESBANK"
        run: python alerts.py
